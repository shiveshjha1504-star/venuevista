spring.application.name=VenueVista
server.port=8080

# Embedded H2 database persisted to ./data (delete the folder to reset demo data)
spring.datasource.url=jdbc:h2:file:./data/venuevista
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.thymeleaf.cache=false
spring.web.locale=en_IN
spring.web.locale-resolver=fixed
server.servlet.session.cookie.same-site=lax
server.error.include-message=never

# Organizer console credentials (change before deploying!)
venuevista.admin.username=admin
venuevista.admin.password=venuevista@2026
