<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('New venue')}"></head>
<body class="adm-body">
<div class="adm-shell">
  <aside th:replace="~{admin/_layout :: side('venues')}"></aside>
  <main class="adm-main">
    <header class="adm-head">
      <div><p class="eyebrow">Spaces</p><h1>New venue</h1></div>
      <a href="/admin/venues" class="btn btn-ghost">← Back</a>
    </header>
    <div class="alert" th:if="${error}" th:text="${error}"></div>

    <form method="post" action="/admin/venues" class="panel form-grid" id="venueForm">
      <label>Venue name<input name="name" required maxlength="100"></label>
      <label>City<input name="city" maxlength="60"></label>
      <label class="span2">Address<input name="address" maxlength="200"></label>
      <label class="span2">Description<textarea name="description" rows="3" maxlength="1000"></textarea></label>

      <fieldset class="span2">
        <legend>Seating sections <small class="muted">(sections are grouped by tier: VIP nearest the stage)</small></legend>
        <div id="sections" class="sections-builder"></div>
        <button type="button" class="btn btn-ghost btn-sm" id="addSection">+ Add section</button>
        <p class="mono muted" id="capLine">Capacity: 0 seats</p>
      </fieldset>
      <div class="span2 form-actions"><button class="btn btn-primary btn-lg" type="submit">Create venue</button></div>
    </form>
  </main>
</div>
<script src="/js/app.js" defer></script>
<script>
(function(){
  var box=document.getElementById('sections'), cap=document.getElementById('capLine');
  function row(n,t,r,s){var d=document.createElement('div');d.className='sec-row';
    d.innerHTML='<input name="secName" placeholder="Section name" value="'+n+'" required>'+
    '<select name="secTier"><option value="VIP">VIP</option><option value="PREMIUM">Premium</option><option value="STANDARD">Standard</option></select>'+
    '<input name="secRows" type="number" min="1" max="26" value="'+r+'" title="Rows">'+
    '<input name="secSeats" type="number" min="1" max="40" value="'+s+'" title="Seats per row">'+
    '<button type="button" class="btn btn-ghost btn-sm rm" aria-label="Remove">✕</button>';
    d.querySelector('select').value=t;
    d.querySelector('.rm').onclick=function(){d.remove();recalc();};
    d.querySelectorAll('input').forEach(function(i){i.addEventListener('input',recalc);});
    box.appendChild(d);recalc();}
  function recalc(){var total=0;box.querySelectorAll('.sec-row').forEach(function(d){
    var i=d.querySelectorAll('input[type=number]');total+=(+i[0].value||0)*(+i[1].value||0);});
    cap.textContent='Capacity: '+total.toLocaleString('en-IN')+' seats';}
  document.getElementById('addSection').onclick=function(){row('','STANDARD',6,10);};
  row('Front Row','VIP',3,10);row('Centre','PREMIUM',6,12);row('Back','STANDARD',8,14);
})();
</script>
</body>
</html>
