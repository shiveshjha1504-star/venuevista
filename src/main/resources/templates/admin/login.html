<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/_layout :: head('Sign in')}"></head>
<body class="login-body">
<main class="login">
  <a href="/" class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 27A14 14 0 0 1 34 27" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="12" r="3" fill="#ffb627"/><circle cx="10.5" cy="19" r="2.2" fill="#8a6bff"/><circle cx="29.5" cy="19" r="2.2" fill="#8a6bff"/><rect x="9" y="30" width="22" height="3" rx="1.5" fill="#38e8b4"/></svg>
    <span class="brand-text">Venue<em>Vista</em></span>
  </a>
  <h1>Backstage <em>pass</em></h1>
  <p class="muted">Sign in to the organizer console.</p>
  <form method="post" action="/admin/login" class="card-form">
    <div class="alert" th:if="${error}" th:text="${error}">Error</div>
    <label>Username<input name="username" required autofocus autocomplete="username"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <button class="btn btn-primary btn-block" type="submit">Enter console</button>
    <p class="fine">Demo credentials: <span class="mono">admin</span> / <span class="mono">venuevista@2026</span></p>
  </form>
  <p class="fine center">VenueVista · a product of Infotact Solutions</p>
</main>
<script src="/js/app.js" defer></script>
</body>
</html>
