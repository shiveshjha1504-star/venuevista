<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title th:text="${title} + ' · VenueVista Console'">Console</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&amp;family=Instrument+Serif:ital@0;1&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="adm-body">
<aside th:fragment="side(active)" class="adm-side">
  <a href="/" class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 27A14 14 0 0 1 34 27" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round"/><circle cx="20" cy="12" r="3" fill="#ffb627"/><circle cx="10.5" cy="19" r="2.2" fill="#8a6bff"/><circle cx="29.5" cy="19" r="2.2" fill="#8a6bff"/><rect x="9" y="30" width="22" height="3" rx="1.5" fill="#38e8b4"/></svg>
    <span class="brand-text">Venue<em>Vista</em></span>
  </a>
  <p class="mono side-label">Organizer console</p>
  <nav>
    <a href="/admin" th:classappend="${active=='dash'} ? 'on'"><span>◐</span> Analytics</a>
    <a href="/admin/events" th:classappend="${active=='events'} ? 'on'"><span>✦</span> Events</a>
    <a href="/admin/venues" th:classappend="${active=='venues'} ? 'on'"><span>▦</span> Venues &amp; seating</a>
    <a href="/admin/orders" th:classappend="${active=='orders'} ? 'on'"><span>❖</span> Orders</a>
    <a href="/admin/checkin" th:classappend="${active=='checkin'} ? 'on'"><span>⌗</span> Gate check-in</a>
  </nav>
  <div class="side-foot">
    <a href="/">← Public site</a>
    <a href="/admin/logout">Sign out</a>
    <p class="mono">A product of<br><b>Infotact Solutions</b></p>
  </div>
</aside>
</body>
</html>
